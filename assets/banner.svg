<circle cx="150" cy="145" r="5" fill="#4ade80"><animate attributeName="opacity" values="1;.15;1" dur="1.80s" repeatCount="indefinite"/></circle>
<circle cx="168" cy="145" r="5" fill="#fbbf24"><animate attributeName="opacity" values="1;.15;1" dur="2.00s" repeatCount="indefinite"/></circle>
<circle cx="186" cy="145" r="5" fill="#f87171"><animate attributeName="opacity" values="1;.15;1" dur="2.20s" repeatCount="indefinite"/></circle>
