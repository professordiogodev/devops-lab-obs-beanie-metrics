<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="341" viewBox="0 0 1000 341" role="img" aria-label="Observability: Beanie Under the Microscope (Metrics)">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#022c22"/><stop offset="1" stop-color="#065f46"/></linearGradient><radialGradient id="glow" cx=".85" cy=".5" r=".6"><stop offset="0" stop-color="#fde047" stop-opacity=".28"/><stop offset="1" stop-color="#fde047" stop-opacity="0"/></radialGradient></defs>
<rect width="1000" height="341" rx="18" fill="url(#bg)"/><rect width="1000" height="341" rx="18" fill="url(#glow)"/>
<circle cx="60" cy="40" r="3" fill="#fde047" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></circle>
<text x="48" y="64" font-size="14" letter-spacing="3" fill="#fde047" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700">DEVOPS BOOTCAMP · LAB</text>
<text x="48" y="112" font-size="36" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Observability: Beanie Under</text>
<text x="48" y="155" font-size="36" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">the Microscope (Metrics)</text>
<text x="48" y="185" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">Beanie runs in containers on one host and the only monitoring is &quot;does</text>
<text x="48" y="207" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">the page load?&quot;. Add Prometheus, node-exporter and cAdvisor so you can</text>
<text x="48" y="229" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">see the machine, the containers and the services, put it on a Grafana</text>
<text x="48" y="251" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">dashboard that is code, write the rules that notice a dead service and…</text>
<rect x="48" y="283" width="122" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#fde047" stroke-opacity=".7"/><text x="62" y="304" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">105-120 min</text>
<rect x="182" y="283" width="587" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#fde047" stroke-opacity=".7"/><text x="196" y="304" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Cost: free on your own machine (Docker with about 4 GB of memory)</text>
<g transform="translate(750,70)">
<circle cx="110" cy="100" r="30" fill="none" stroke="#fde047" stroke-opacity=".35"/>
<circle cx="110" cy="100" r="60" fill="none" stroke="#fde047" stroke-opacity=".35"/>
<circle cx="110" cy="100" r="90" fill="none" stroke="#fde047" stroke-opacity=".35"/>
<path d="M110 100 L110 10 A90 90 0 0 1 172 36 Z" fill="#fde047" opacity=".35"><animateTransform attributeName="transform" type="rotate" from="0 110 100" to="360 110 100" dur="4s" repeatCount="indefinite"/></path>
<circle cx="150" cy="60" r="5" fill="#fde047" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="0.0s" repeatCount="indefinite"/></circle>
<circle cx="70" cy="120" r="5" fill="#fde047" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="1.3s" repeatCount="indefinite"/></circle>
<circle cx="140" cy="140" r="5" fill="#fde047" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="2.6s" repeatCount="indefinite"/></circle>
</g>
</svg>